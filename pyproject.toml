[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "bohri_calendar"
version = "0.1.0"
authors = [
    { name="yusuf-bot", email="yusuff.0279@gmail.com" },
]
description = "A Bohri Calendar conversion and PDF generation library"
readme = "README.md"
requires-python = ">=3.6"
license = "MIT"
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
]
dependencies = [
    "playwright",
    "Pillow",
    "reportlab",
    "asyncio",
]

[project.urls]
"Homepage" = "https://github.com/yusuf-bot/bohri-calendar"
"Bug Tracker" = "https://github.com/yusuf-bot/bohri-calendar/issues"