services:
  - type: web
    name: time-travel-calendar
    runtime: python
    buildCommand: pip install -r requirements.txt && PLAYWRIGHT_BROWSERS_PATH=0 playwright install chromium
    startCommand: python server/app.py
    envVars:
      - key: PORT
        value: 5001
      - key: PYTHON_VERSION
        value: 3.9.0
    healthCheckPath: /api/health